<script type="text/javascript">
  var chart1 = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "description": "Vertical Survival Rate by Passenger Class and Gender",
    "data": { "url": "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv" },
    "mark": "bar", "tooltip": true,
    "encoding": {
      "x": { "field": "Pclass", "type": "ordinal", "title": "Passenger Class" },
      "y": { "field": "Survived", "type": "quantitative", "aggregate": "mean", "title": "Survival Rate", "axis": { "format": "%" } },
      "color": { "field": "Sex", "type": "nominal", "title": "Gender", "scale": { "domain": ["female", "male"] } },
      "xOffset": { "field": "Sex" },
	"tooltip": [
    	{ "field": "Pclass", "type": "ordinal", "title": "Class" },
    	{ "field": "Sex", "type": "nominal", "title": "Gender" },
    	{ "field": "Survived", "type": "quantitative", "aggregate": "mean", "title": "Survival Rate", "format": ".1%" }
  		]
    },
    "width": 800,
    "height": 500
  };

  var chart2 = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "description": "Horizontal Survival Rate by Passenger Class and Gender",
    "data": { "url": "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv" },
    "mark": "bar", "tooltip": true,
    "encoding": {
      "y": { "field": "Pclass", "type": "ordinal", "title": "Passenger Class" },
      "x": { "field": "Survived", "type": "quantitative", "aggregate": "mean", "title": "Survival Rate", "axis": { "format": "%" } },
      "color": { "field": "Sex", "type": "nominal", "title": "Gender", "scale": { "domain": ["female", "male"], "range": ["#5B5941", "#afc2d5"] } },
      "yOffset": { "field": "Sex" },
	"tooltip": [
    	{ "field": "Pclass", "type": "ordinal", "title": "Class" },
    	{ "field": "Sex", "type": "nominal", "title": "Gender" },
    	{ "field": "Survived", "type": "quantitative", "aggregate": "mean", "title": "Survival Rate", "format": ".1%" }
  		]
    },
    "width": 800,
    "height": 500
  };

  var chart3 = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "data": { "url": "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv" },
    "mark": "bar", "tooltip": true,
    "encoding": {
      "x": { "field": "Pclass", "type": "nominal", "title": "Passenger Class" },
      "y": { "aggregate": "count", "type": "quantitative", "title": "Number of Passengers" },
      "color": { "field": "Sex", "type": "nominal", "scale": { "domain": ["female", "male"], "range": ["#c1121f", "#fdc500"] }, "title": "Sex" },
	"tooltip": [
    	{ "field": "Pclass", "type": "nominal", "title": "Class" },
    	{ "field": "Sex", "type": "nominal", "title": "Gender" },
    	{ "aggregate": "count", "type": "quantitative", "title": "Count" }
  		]
    },
    "width": 800,
    "height": 500
  };

  var chart4 = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "data": { "url": "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv" },
    "encoding": {
      "y": { "field": "Pclass", "type": "ordinal", "title": "Passenger Class" }
    },
    "layer": [
      {
        "mark": { "type": "bar", "tooltip": true },
        "encoding": {
          "x": { "aggregate": "mean", "field": "Survived", "type": "quantitative", "title": "Survival Rate", "stack": "normalize", "axis": { "format": "%" } },
          "color": { "field": "Sex", "type": "nominal", "scale": { "domain": ["female", "male"], "range": ["#c1121f", "#BDBF09"] }, "title": "Gender" }
        }
      },
      {
        "mark": { "type": "text", "opacity": 0.9, "color": "white" },
        "encoding": {
          "x": { "aggregate": "mean", "field": "Survived", "type": "quantitative", "stack": "normalize" },
          "text": { "aggregate": "mean", "field": "Survived", "type": "quantitative", "format": ".1%" },
          "detail": { "field": "Sex" }
        }
      }
    ],
    "width": 800,
    "height": 500
  };

	const embedOpts = {
  		actions: true,
  		tooltip: true 
	};
	
	document.addEventListener("DOMContentLoaded", function () {
 		vegaEmbed('#vis1', chart1, embedOpts);
  		vegaEmbed('#vis2', chart2, embedOpts);
  		vegaEmbed('#vis3', chart3, embedOpts);
 		vegaEmbed('#vis4', chart4, embedOpts);
	});
</script>
