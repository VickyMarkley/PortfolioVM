		<!-- Vega Lite Charts -->
			<script type="text/javascript">
   			 var chart1 = {
        		"$schema": "https://vega.github.io/schema/vega-lite/v5.json",
       		 "description": "Vertical Survival Rate by Passenger Class and Gender",
       		 "data": {
         		   "url": "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
      		  },
       		 "mark": "bar",
       		 "encoding": {
        		    "x": {"field": "Pclass", "type": "ordinal", "title": "Passenger Class"},
       		     	"y": {
          		    	"field": "Survived",
                		"type": "quantitative",
                		"aggregate": "mean",
                		"title": "Survival Rate",
                		"axis": {"format": "%"}
            		},
            		"color": {
                		"field": "Sex",
               	 		"type": "nominal",
                		"title": "Gender",
                		"scale": {"domain": ["female", "male"]}
            		},
            		"xOffset": {"field": "Sex"}
        		},
				"width": 700,
  				"height":500
    		};

				var chart2 = {
  					"$schema": "https://vega.github.io/schema/vega-lite/v6.json",

 				 "data": {
    		"url": "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
 			 },
  		"mark": "bar",
  		"encoding": {
    		"y": {"field": "Pclass", "type": "ordinal", "title": "Passenger Class"},

      			"field": "Survived",
      			"type": "quantitative",
      			"aggregate": "mean",
      			"title": "Survival Rate",
     			"axis": {"format": "%"}
    		},
    		"color": {
      			"field": "Sex",
      			"type": "nominal",
      			"title": "Gender",
      			"scale": {"domain": ["female", "male"], "range": ["#5B5941", "#afc2d5"]}
    		},
    		"yOffset": {"field": "Sex"}
  		},
			"width": 700,
  			"height":500
		}

			 var chart3 = {}

			 vegaEmbed('#vis1', chart1);
